name: seal-build

# Build-and-pack only: the test suite runs on Travis (.travis.yml).
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Build jar
        run: ./gradlew :spring-kafka:jar --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: spring-kafka-jar
          path: spring-kafka/build/libs/spring-kafka-2.5.8.RELEASE.jar
          if-no-files-found: error
